# GitHub Actions workflow for PR Metrics
# This file should be placed in a rocm-libraries fork at:
#   .github/workflows/pr-metrics.yml
#
# Prerequisites:
# - rocMETRICS package installed (pip install git+https://github.com/MKashirnyy/rocMETRICS.git@feature/pr-delta)
# - gh CLI is pre-installed on GitHub Actions runners

name: PR Metrics

on:
  pull_request:
    branches: [develop]

jobs:
  pr-delta:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rocmetrics
        run: pip install git+https://${{ secrets.ROCMETRICS_PAT }}@github.com/MKashirnyy/rocMETRICS.git@feature/pr-delta

      - name: Run PR Delta Analysis
        id: pr-delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rocmetrics pr-delta \
            --use-github-api \
            --github-owner ${{ github.repository_owner }} \
            --github-repo ${{ github.event.repository.name }} \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --head-ref ${{ github.event.pull_request.head.sha }} \
            --component rocm-libraries \
            --pr-number ${{ github.event.pull_request.number }} \
            --author "${{ github.event.pull_request.user.login }}" \
            --branch "${{ github.head_ref }}" \
            --base-branch "${{ github.base_ref }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --ci-job-name "${{ github.job }}" \
            --ci-run-id "${{ github.run_id }}" \
            > pr-delta.json

      # Hotspot warnings are emitted to stderr during analysis
      # and appear as workflow annotations automatically

      - name: Display PR Delta Results
        run: |
          echo "## PR Delta Analysis" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat pr-delta.json | jq '.payload | {
            files_analyzed,
            functions_analyzed,
            ccn_regressions,
            ccn_improvements,
            churn_pr,
            churn_historical,
            hotspot_files_count,
            max_risk_score
          }' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-delta-report
          path: pr-delta.json
          retention-days: 30

      # TODO: Hotspot detection currently uses absolute threshold (20 commits).
      # Future improvement: Switch to Pareto (P95) relative to repo average.
      # This would require either:
      # - Caching P95 from the last datacollector batch report
      # - Additional API request to sample repo-wide churn

      - name: Upload to Elasticsearch
        if: success()
        env:
          ELASTICSEARCH_HOST: ${{ secrets.ES_HOST }}
          ELASTICSEARCH_API_KEY: ${{ secrets.ES_API_KEY }}
        run: |
          rocmetrics upload rocm-libraries-pr-delta \
            --file pr-delta.json \
            --no-defaults \
            --no-verify-certs
